name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-quality-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --cov=storage --cov-report=term-missing --cov-fail-under=80
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tkinter smoke test
        run: xvfb-run -a python -c "from pathlib import Path; import tempfile; from storage.local_storage import LocalStorage; from ui.main_window import MainWindow; t=tempfile.TemporaryDirectory(); app=MainWindow(LocalStorage(Path(t.name))); app.update_idletasks(); assert app.title() == 'Biblioteca de Projetos QA'; app.destroy(); print('SMOKE_OK')"
      - run: python -m PyInstaller --noconfirm --clean BibliotecaDeProjetos.spec
      - run: tar -czf BibliotecaDeProjetos-linux.tar.gz -C dist BibliotecaDeProjetos
      - uses: actions/upload-artifact@v4
        with:
          name: BibliotecaDeProjetos-linux
          path: BibliotecaDeProjetos-linux.tar.gz

  windows-quality-build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-2019, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --cov=storage --cov-report=term-missing --cov-fail-under=80
      - run: python -m PyInstaller --noconfirm --clean BibliotecaDeProjetos.spec
      - name: Smoke test executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BibliotecaDeProjetos.exe")) { throw "Executável não gerado" }
          Get-Item "dist/BibliotecaDeProjetos.exe"
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/BibliotecaDeProjetos.exe -DestinationPath BibliotecaDeProjetos-windows-${{ matrix.os }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BibliotecaDeProjetos-${{ matrix.os }}
          path: |
            dist/BibliotecaDeProjetos.exe
            BibliotecaDeProjetos-windows-${{ matrix.os }}.zip
