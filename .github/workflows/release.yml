name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --cov=storage --cov-fail-under=80
      - run: python -m PyInstaller --noconfirm --clean BibliotecaDeProjetos.spec
      - run: cp dist/BibliotecaDeProjetos BibliotecaDeProjetos-linux
      - run: tar -czf BibliotecaDeProjetos-linux.tar.gz BibliotecaDeProjetos-linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            BibliotecaDeProjetos-linux
            BibliotecaDeProjetos-linux.tar.gz

  build-windows:
    strategy:
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: pytest --cov=storage --cov-fail-under=80
      - run: python -m PyInstaller --noconfirm --clean BibliotecaDeProjetos.spec
      - name: Verify executable
        shell: pwsh
        run: if (-not (Test-Path "dist/BibliotecaDeProjetos.exe")) { throw "Executável não gerado" }
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/BibliotecaDeProjetos.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) { throw "Executável encerrou inesperadamente com código $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Package Windows
        shell: pwsh
        run: |
          Copy-Item dist/BibliotecaDeProjetos.exe BibliotecaDeProjetos-${{ matrix.os }}.exe
          Compress-Archive -Path BibliotecaDeProjetos-${{ matrix.os }}.exe -DestinationPath BibliotecaDeProjetos-windows-${{ matrix.os }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            BibliotecaDeProjetos-${{ matrix.os }}.exe
            BibliotecaDeProjetos-windows-${{ matrix.os }}.zip

  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generate SHA-256 checksums
        run: |
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name 'BibliotecaDeProjetos-linux' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/**/BibliotecaDeProjetos-linux
            release-assets/**/BibliotecaDeProjetos-linux.tar.gz
            release-assets/**/BibliotecaDeProjetos-windows-2022.exe
            release-assets/**/BibliotecaDeProjetos-windows-windows-2022.zip
            release-assets/**/BibliotecaDeProjetos-windows-2025.exe
            release-assets/**/BibliotecaDeProjetos-windows-windows-2025.zip
            release-assets/SHA256SUMS.txt
